<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secondhand Shop{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.45;
    }
    .container { width: min(1120px, 92vw); margin: 0 auto; }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 70px;
    }
    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.2px;
      text-decoration: none;
      color: var(--text);
    }
    nav { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    nav a {
      display: inline-block;
      padding: 0.46rem 0.78rem;
      border-radius: 10px;
      color: #374151;
      text-decoration: none;
      font-size: 0.95rem;
    }
    nav a:hover { background: #eef2ff; color: #1e3a8a; }
    main { padding: 1.6rem 0 2.2rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.05rem 1.15rem;
    }
    h1, h2, h3 { margin: 0 0 0.7rem; line-height: 1.2; }
    h1 { font-size: clamp(1.45rem, 2.4vw, 2rem); }
    p { margin: 0.55rem 0; }
    small, .muted { color: var(--muted); }
    .btn {
      display: inline-block;
      border: 0;
      border-radius: 10px;
      padding: 0.55rem 0.95rem;
      text-decoration: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: #111827;
    }
    .btn-danger { background: var(--danger); }
    .stack { display: grid; gap: 1rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.9rem;
    }
    .product-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .product-media {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #f3f4f6;
      border-bottom: 1px solid var(--border);
    }
    .product-content { padding: 0.72rem 0.8rem 0.85rem; }
    .product-title { font-weight: 600; margin: 0 0 0.35rem; }
    .price { font-weight: 700; color: #111827; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .spaced { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.7rem 0.9rem;
    }
    form p { margin: 0; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.65rem;
      font: inherit;
      background: white;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 0.55rem 0.45rem; text-align: left; }
    th { color: #374151; font-size: 0.92rem; }
    .chip {
      display: inline-block;
      font-size: 0.78rem;
      padding: 0.22rem 0.5rem;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
    }
    .section-title { margin-bottom: 0.35rem; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    a { color: #1d4ed8; }
    @media (max-width: 700px) {
      .topbar { flex-direction: column; align-items: flex-start; padding: 0.7rem 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <a class="brand" href="{% url 'shop:catalog' %}">Secondhand Shop</a>
      <nav>
        <a href="{% url 'shop:catalog' %}">Каталог</a>
        <a href="{% url 'shop:product_add' %}">Добавить товар</a>
        <a href="{% url 'shop:promotion_list' %}">Акции</a>
        <a href="{% url 'shop:lab2_report' %}">ORM-демо</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container stack">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
